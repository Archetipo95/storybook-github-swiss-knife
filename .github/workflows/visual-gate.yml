name: Visual Gate

# Trusted half of the visual pipeline. Runs after an untrusted visual run completes, from the
# default branch: it never checks out or runs pull request code. It evaluates the run's results
# bundle with the default branch's configuration, posts the required check runs
# (swiss-knife / visual, swiss-knife / accessibility) on the head commit, withdraws a stale
# approval label, and publishes the report next to the PR's Storybook preview.
#
# Call it from a workflow on `workflow_run` (types: completed) of the workflow that calls
# visual.yml; a workflow_run trigger cannot live in a reusable workflow. This repository does
# so in dogfood-visual-gate.yml.

on:
  workflow_call:
    inputs:
      workflow_run_id:
        description: 'Run to gate (defaults to github.event.workflow_run.id)'
        required: false
        type: number
      working_directory:
        description: 'Project directory (holds .storybook/), relative to the repository root'
        required: false
        type: string
        default: '.'
      caller_workflow:
        description: >-
          Path of the workflow that calls visual.yml (e.g. .github/workflows/visual.yml). When set,
          runs from any other workflow file, or from a pull request that changes it, fail the checks.
        required: false
        type: string
        default: ''
      protected_paths:
        description: 'More files (newline-separated) that must be unchanged from the default branch'
        required: false
        type: string
        default: ''
      site_url:
        description: 'Public Pages URL, when not https://<owner>.github.io/<repo>'
        required: false
        type: string
        default: ''
    secrets:
      passcode_hash:
        description: 'SHA-256 hex hash of the Storybook passcode, to gate the published report'
        required: false

permissions:
  contents: read

jobs:
  gate:
    name: Gate visual and accessibility results (trusted)
    if: github.event.workflow_run.event == 'pull_request' || inputs.workflow_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # No concurrency group: GitHub drops pending jobs of a group, which could leave a stale
    # check. Pages writes retry on conflicts (src/git-branch-writer.js).
    permissions:
      actions: read
      checks: write
      contents: write
      issues: write
      pull-requests: write
    env:
      RUN_ID: ${{ inputs.workflow_run_id || github.event.workflow_run.id }}
    steps:
      - name: Checkout default branch (trusted configuration)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load swiss-knife toolkit
        uses: Archetipo95/storybook-github-swiss-knife/actions/toolkit@22ce85d707c759e84bc0803d430eb53701e551cc

      - name: Find the results bundle
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A re-run uploads the bundle again under the same name: use the latest attempt's.
          bundles="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.expired | not) | [.created_at, (.id | tostring), .name] | @tsv' | awk -F '\t' -v pattern="^swiss-knife-visual-pr-[0-9]+-run-$RUN_ID\$" '$3 ~ pattern' | sort)"
          if [ "$(printf '%s\n' "$bundles" | cut -f3 | grep . | sort -u | wc -l)" = 1 ]; then
            echo "id=$(printf '%s\n' "$bundles" | tail -n 1 | cut -f2)" >> "$GITHUB_OUTPUT"
          else
            echo "No single results bundle in run $RUN_ID."
          fi

      # By id through the API: download-artifact keeps one artifact per name, not always the newest.
      # The bundle is untrusted data; readBundle rejects symlinks, .git and .github in it.
      - name: Download results bundle
        if: steps.artifact.outputs.id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.id }}
        run: |
          bundle="$RUNNER_TEMP/swiss-knife-bundle"
          mkdir -p "$bundle"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$RUNNER_TEMP/swiss-knife-bundle.zip"
          unzip -q "$RUNNER_TEMP/swiss-knife-bundle.zip" -d "$bundle"

      - name: Resolve Pages branch
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          branch="$(cd "$WORKING_DIRECTORY" && node -e 'import(process.env.SWISS_KNIFE_ROOT + "/src/config.js").then(({resolveConfiguration}) => console.log(resolveConfiguration({inputs: {}}).pages_branch))')"
          if gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --silent 2>/dev/null; then
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "Pages branch $branch does not exist; the report will not be published."
          fi

      - name: Checkout Pages branch
        if: steps.pages.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pages.outputs.branch }}
          # actions/checkout only writes inside the workspace (the trusted default-branch checkout).
          path: .swiss-knife-pages
          fetch-depth: 0

      - name: Gate and post checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PROJECT_DIR: ${{ github.workspace }}/${{ inputs.working_directory }}
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          BUNDLE_DIR: ${{ runner.temp }}/swiss-knife-bundle
          PAGES_REPO: ${{ steps.pages.outputs.branch != '' && format('{0}/.swiss-knife-pages', github.workspace) || '' }}
          SITE_URL: ${{ inputs.site_url }}
          CALLER_WORKFLOW: ${{ inputs.caller_workflow }}
          PROTECTED_PATHS: ${{ inputs.protected_paths }}
          PASSCODE_HASH: ${{ secrets.passcode_hash }}
        run: node "$SWISS_KNIFE_ROOT/src/gate/run.js"
