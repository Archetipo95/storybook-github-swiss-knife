name: Deploy Storybook to GitHub Pages

on:
  workflow_call:
    inputs:
      path:
        description: 'Path to the built static Storybook directory'
        required: false
        type: string
        default: ''
      package_manager:
        description: 'Package manager to use (npm, yarn, pnpm, bun)'
        required: false
        type: string
        default: ''
      cache:
        description: 'Whether to restore and save dependency and Storybook compilation caches in the read-only build job'
        required: false
        type: boolean
        default: true
      cache_key_prefix:
        description: 'Prefix for Bun and Storybook compilation cache keys'
        required: false
        type: string
        default: 'storybook-gh-pages'
      install_command:
        description: 'Custom command to install dependencies'
        required: false
        type: string
        default: ''
      build_command:
        description: 'Custom command to build Storybook'
        required: false
        type: string
        default: ''
      artifact_name:
        description: 'GitHub Pages artifact name'
        required: false
        type: string
        default: 'github-pages'
      environment:
        description: 'GitHub Pages deployment environment name'
        required: false
        type: string
        default: 'github-pages'
      create_deployment:
        description: 'Whether to create a native GitHub deployment record and status lifecycle for the Pages deployment (default: true; empty uses the config file, then the default)'
        required: false
        type: string
        default: ''
      environment_name:
        description: 'GitHub deployment environment name for Pages/native deployment records'
        required: false
        type: string
        default: 'github-pages'
      environment_url:
        description: 'Explicit environment URL to expose on the deployment record'
        required: false
        type: string
        default: ''
      mode:
        description: 'Deployment mode: artifact or trusted branch-backed directory'
        required: false
        type: string
        default: ''
      pages_branch:
        description: 'Branch used by directory mode'
        required: false
        type: string
        default: ''
      target_directory:
        description: 'Directory replaced by directory mode; empty publishes the root'
        required: false
        type: string
        default: ''
      site_url:
        description: 'Canonical Pages site URL for metadata'
        required: false
        type: string
        default: ''
      base_path:
        description: 'Optional URL base path'
        required: false
        type: string
        default: ''
      cname:
        description: 'Directory mode: custom domain written to a CNAME file at the Pages branch root (for example, storybook.example.com). Ignored in artifact mode; configure the domain in repository Settings > Pages'
        required: false
        type: string
        default: ''
      preserve_cname:
        description: 'Directory mode: whether to keep the existing root CNAME when a root publish does not provide one (default: true; empty uses the config file, then the default)'
        required: false
        type: string
        default: ''
      auto_base_url:
        description: 'Whether to set BASE_URL, PUBLIC_URL and STORYBOOK_BASE_HREF to the deployment base URL for the build command (the command itself runs unchanged; default: true; empty uses the config file, then the default)'
        required: false
        type: string
        default: ''
      managed_directories:
        description: 'Comma-separated managed directories preserved at the root'
        required: false
        type: string
        default: ''
      generate_badges:
        description: 'Whether to auto-generate dynamic SVG badges for components and stories (default: true; empty uses the config file, then the default)'
        required: false
        type: string
        default: ''
      badges_directory:
        description: 'Directory within the static build output to store generated badges'
        required: false
        type: string
        default: 'badges'
      test_results_path:
        description: 'Optional repository-relative path to a JSON Storybook interaction test results file'
        required: false
        type: string
        default: ''
      enable_passcode_gate:
        description: 'Whether to inject a client-side passcode gate into the published Storybook (default: false; empty uses the config file, then the default)'
        required: false
        type: string
        default: ''
      passcode_session_hours:
        description: 'Hours before the browser session expires'
        required: false
        type: number
        default: 24
      smoke_test:
        description: 'Whether to run an opt-in Playwright smoke test before publishing (default: false; empty uses the config file, then the default)'
        required: false
        type: string
        default: ''
      smoke_test_stories:
        description: 'Comma-separated story id globs to smoke test, or all'
        required: false
        type: string
        default: 'all'
      smoke_test_timeout_ms:
        description: 'Per-page Playwright navigation timeout in milliseconds'
        required: false
        type: number
        default: 30000
      audit_bundle_size:
        description: 'Whether to audit static asset sizes and append a bundle size scorecard to the job summary (default: false; empty uses the config file, then the default)'
        required: false
        type: string
        default: ''
      bundle_size_max_mb:
        description: 'Optional total static output budget in megabytes; the build fails when the audit exceeds it'
        required: false
        type: string
        default: ''
    secrets:
      passcode_hash:
        description: 'SHA-256 hash of the Storybook passcode'
        required: false
    outputs:
      page_url:
        description: 'The URL of the deployed GitHub Pages site'
        value: ${{ jobs.directory-publish.outputs.page_url || jobs.deploy.outputs.page_url }}
      status:
        description: 'Status of the deployment'
        value: ${{ jobs.directory-publish.outputs.status || jobs.deploy.outputs.status }}
      deployment_id:
        description: 'The deployment ID'
        value: ${{ jobs.deploy.outputs.deployment_id }}

concurrency:
  group: storybook-pages-${{ github.repository }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build & Validate Storybook
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.config.outputs.mode }}
      environment: ${{ steps.config.outputs.environment }}
      environment_name: ${{ steps.config.outputs.environment_name }}
      environment_url: ${{ steps.config.outputs.environment_url }}
      create_deployment: ${{ steps.config.outputs.create_deployment }}
      pages_branch: ${{ steps.config.outputs.pages_branch }}
      target_directory: ${{ steps.config.outputs.target_directory }}
      site_url: ${{ steps.config.outputs.site_url }}
      base_path: ${{ steps.config.outputs.base_path }}
      auto_base_url: ${{ steps.config.outputs.auto_base_url }}
      cname: ${{ steps.config.outputs.cname }}
      preserve_cname: ${{ steps.config.outputs.preserve_cname }}
      managed_directories: ${{ steps.config.outputs.managed_directories }}
      preview_root: ${{ steps.config.outputs.preview_root }}
      artifact_name: ${{ steps.config.outputs.artifact_name }}
      generate_badges: ${{ steps.config.outputs.generate_badges }}
      badges_directory: ${{ steps.config.outputs.badges_directory }}
      generate_stats_graph: ${{ steps.config.outputs.generate_stats_graph }}
      stats_directory: ${{ steps.config.outputs.stats_directory }}
      test_results_path: ${{ steps.config.outputs.test_results_path }}
      enable_passcode_gate: ${{ steps.config.outputs.enable_passcode_gate }}
      passcode_session_hours: ${{ steps.config.outputs.passcode_session_hours }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The steps below run swiss-knife's own scripts (SWISS_KNIFE_ROOT), never ./src of the
      # checked-out caller repository.
      - name: Load swiss-knife toolkit
        uses: Archetipo95/storybook-github-swiss-knife/actions/toolkit@c96f2b7bb57f43a2295bf794e4b1c9df8c0724c5

      - name: Resolve and validate configuration
        id: config
        env:
          CONFIG_INPUTS: ${{ toJSON(inputs) }}
        run: |
          node -e 'Promise.all(["config.js", "install-command.js", "command-file.js"].map(file => import(process.env.SWISS_KNIFE_ROOT + "/src/" + file))).then(([{resolveConfiguration}, {findLockfile, resolveInstallCommand}, {formatCommandFile}]) => {
            const c = resolveConfiguration({inputs: JSON.parse(process.env.CONFIG_INPUTS), defaults: {create_deployment: true}});
            const install = resolveInstallCommand({installCommand: c.build.install_command, buildCommand: c.build.build_command, packageManager: c.package_manager});
            if (install.warning) console.error(`::warning::${install.warning}`);
            if (install.notice) console.error(`::notice::${install.notice}`);
            const outputs = {};
            for (const [key, value] of Object.entries(c)) {
              if (typeof value !== "object") outputs[key] = value ?? "";
            }
            // The preview root is managed too, so a root publish keeps the PR previews. Top-level
            // names only: the pinned publisher keeps an entry on an exact name match.
            const managed = Array.isArray(c.managed_directories) ? c.managed_directories : String(c.managed_directories || "").split(",");
            const kept = [...managed, c.preview_root].map(value => String(value || "").trim().replace(/^(\.\/)+/, "").split("/")[0]).filter(Boolean);
            Object.assign(outputs, {
              managed_directories: [...new Set(kept)].join(","),
              artifact_name: c.artifact_name || "github-pages",
              test_results_path: c.test_results_path || "",
              install_command: install.command,
              // The setup-node dependency cache fails without a lockfile.
              dependency_lockfile: findLockfile(process.cwd(), c.package_manager) ?? "",
              build_command: c.build.build_command ?? "",
              auto_base_url: c.auto_base_url,
              create_deployment: String(Boolean(c.create_deployment)),
              environment_name: c.environment_name || "",
              environment_url: c.environment_url || ""
            });
            process.stdout.write(formatCommandFile(outputs));
          })' >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: ${{ steps.config.outputs.package_manager == 'npm' || steps.config.outputs.package_manager == 'yarn' || steps.config.outputs.package_manager == 'pnpm' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      # A fresh runner has no pnpm, and setup-node's pnpm and Yarn caches run the tool, so they
      # come from corepack (at the version in package.json "packageManager"), before the cache.
      - name: Enable corepack
        if: ${{ steps.config.outputs.package_manager == 'pnpm' || steps.config.outputs.package_manager == 'yarn' }}
        run: corepack enable

      - name: Restore dependency cache
        if: ${{ inputs.cache && steps.config.outputs.dependency_lockfile != '' && (steps.config.outputs.package_manager == 'npm' || steps.config.outputs.package_manager == 'yarn' || steps.config.outputs.package_manager == 'pnpm') }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: ${{ steps.config.outputs.package_manager }}

      - name: Set up Bun
        if: ${{ steps.config.outputs.package_manager == 'bun' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Restore Bun dependency cache
        if: ${{ inputs.cache && steps.config.outputs.package_manager == 'bun' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ inputs.cache_key_prefix }}-bun-${{ hashFiles('**/bun.lock', '**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.cache_key_prefix }}-bun-

      - name: Restore Storybook compilation cache
        if: ${{ inputs.cache }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules/.cache/storybook
            .cache/storybook
            .storybook/.cache
          key: ${{ runner.os }}-${{ inputs.cache_key_prefix }}-storybook-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx', '**/*.vue', '**/*.svelte', '**/*.mdx', '.storybook/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.cache_key_prefix }}-storybook-

      - name: Install dependencies
        if: ${{ steps.config.outputs.install_command != '' }}
        env:
          INSTALL_COMMAND: ${{ steps.config.outputs.install_command }}
        run: eval "$INSTALL_COMMAND"

      - name: Run custom build command
        if: ${{ steps.config.outputs.build_command != '' }}
        env:
          BUILD_COMMAND: ${{ steps.config.outputs.build_command }}
          AUTO_BASE_URL: ${{ steps.config.outputs.auto_base_url }}
          REPOSITORY: ${{ github.repository }}
          SITE_URL: ${{ steps.config.outputs.site_url }}
          BASE_PATH: ${{ steps.config.outputs.base_path }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_ROOT: ${{ steps.config.outputs.preview_root }}
        run: |
          CMD="$BUILD_COMMAND"
          if [ "$AUTO_BASE_URL" = "true" ]; then
            eval "$(node -e 'import(process.env.SWISS_KNIFE_ROOT + "/src/base-url.js").then(({computeBaseUrl, buildEnvironment, shellQuote}) => { const baseUrl = computeBaseUrl({repository: process.env.REPOSITORY, siteUrl: process.env.SITE_URL, basePath: process.env.BASE_PATH, eventName: process.env.EVENT_NAME, prNumber: process.env.PR_NUMBER, previewRoot: process.env.PREVIEW_ROOT}); for (const [key, value] of Object.entries(buildEnvironment(baseUrl))) console.log(`export ${key}=${shellQuote(value)}`); })')"
          fi
          eval "$CMD"

      # The audit runs before badges/stats are written so it measures the
      # Storybook build output only.
      - name: Audit Storybook bundle size
        if: ${{ steps.config.outputs.audit_bundle_size == 'true' }}
        env:
          TARGET_PATH: ${{ steps.config.outputs.path }}
          SB_BUNDLE_SIZE_MAX_MB: ${{ steps.config.outputs.bundle_size_max_mb }}
          WORKSPACE_ROOT: ${{ github.workspace }}
        run: node "$SWISS_KNIFE_ROOT/src/audit-static.js" "$TARGET_PATH" "$WORKSPACE_ROOT"

      - name: Generate Storybook badges
        if: ${{ steps.config.outputs.generate_badges == 'true' }}
        env:
          TARGET_PATH: ${{ steps.config.outputs.path }}
          WORKSPACE_ROOT: ${{ github.workspace }}
          SB_BADGES_DIRECTORY: ${{ steps.config.outputs.badges_directory }}
          SB_TEST_RESULTS_PATH: ${{ steps.config.outputs.test_results_path }}
          SB_COVERAGE_INCLUDE_PATHS: ${{ steps.config.outputs.coverage_include_paths }}
          SB_COVERAGE_IGNORE_PATHS: ${{ steps.config.outputs.coverage_ignore_paths }}
          SB_SITE_URL: ${{ steps.config.outputs.site_url }}
          SB_BASE_PATH: ${{ steps.config.outputs.base_path }}
        run: node "$SWISS_KNIFE_ROOT/src/generate-badges.js" "$TARGET_PATH" "$WORKSPACE_ROOT"

      # Directory mode: the publisher adds this snapshot to the Pages branch's history. It is
      # computed here because the publish job has no source, so it cannot count coverage.
      - name: Generate Storybook stats snapshot
        if: ${{ steps.config.outputs.generate_stats_graph == 'true' && steps.config.outputs.mode == 'directory' }}
        env:
          TARGET_PATH: ${{ steps.config.outputs.path }}
          WORKSPACE_ROOT: ${{ github.workspace }}
          SB_STATS_DIRECTORY: ${{ steps.config.outputs.stats_directory }}
          SB_COVERAGE_INCLUDE_PATHS: ${{ steps.config.outputs.coverage_include_paths }}
          SB_COVERAGE_IGNORE_PATHS: ${{ steps.config.outputs.coverage_ignore_paths }}
        run: node "$SWISS_KNIFE_ROOT/src/generate-stats.js" "$TARGET_PATH" "$WORKSPACE_ROOT"

      - name: Run Storybook smoke test
        if: ${{ steps.config.outputs.smoke_test == 'true' }}
        env:
          TARGET_PATH: ${{ steps.config.outputs.path }}
          WORKSPACE_ROOT: ${{ github.workspace }}
          SMOKE_TEST_STORIES: ${{ steps.config.outputs.smoke_test_stories }}
          SMOKE_TEST_TIMEOUT_MS: ${{ steps.config.outputs.smoke_test_timeout_ms }}
        run: node "$SWISS_KNIFE_ROOT/src/smoke-test.js" "$TARGET_PATH" "$WORKSPACE_ROOT" "$SMOKE_TEST_STORIES" "$SMOKE_TEST_TIMEOUT_MS"

      - name: Validate static artifact
        run: |
          node -e '
            import(process.env.SWISS_KNIFE_ROOT + "/src/validate-artifact.js").then(m => {
              m.validateArtifactDirectory(process.env.TARGET_PATH, process.env.WORKSPACE_ROOT);
              console.log("Artifact validation successful");
            });
          '
        env:
          TARGET_PATH: ${{ steps.config.outputs.path }}
          WORKSPACE_ROOT: ${{ github.workspace }}

      - name: Inject Storybook passcode gate
        if: ${{ steps.config.outputs.enable_passcode_gate == 'true' }}
        env:
          TARGET_PATH: ${{ steps.config.outputs.path }}
          PASSCODE_HASH: ${{ secrets.passcode_hash }}
          PASSCODE_SESSION_HOURS: ${{ steps.config.outputs.passcode_session_hours }}
        run: node "$SWISS_KNIFE_ROOT/src/inject-auth-gate.js" "$TARGET_PATH"

      - name: Ensure .nojekyll exists
        env:
          TARGET_PATH: ${{ steps.config.outputs.path }}
        run: |
          if [ -d "$TARGET_PATH" ]; then
            touch "$TARGET_PATH/.nojekyll"
          fi

      - name: Warn about ignored custom domain
        if: ${{ steps.config.outputs.cname != '' && steps.config.outputs.mode == 'artifact' }}
        run: echo '::warning title=cname ignored in artifact mode::GitHub Pages ignores CNAME files for GitHub Actions (artifact) deployments. Configure the custom domain in repository Settings > Pages instead.'

      - name: Upload Pages artifact
        if: ${{ steps.config.outputs.mode == 'artifact' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.config.outputs.path }}
          name: ${{ steps.config.outputs.artifact_name }}

      - name: Upload trusted directory input
        if: ${{ steps.config.outputs.mode == 'directory' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.config.outputs.path }}
          name: ${{ steps.config.outputs.artifact_name }}
          if-no-files-found: error
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-upload
    if: ${{ needs.build-and-upload.result == 'success' && needs.build-and-upload.outputs.mode == 'artifact' }}
    runs-on: ubuntu-24.04
    environment:
      name: ${{ needs.build-and-upload.outputs.environment_name || needs.build-and-upload.outputs.environment || 'github-pages' }}
      url: ${{ needs.build-and-upload.outputs.environment_url || steps.deploy-pages.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      deployments: write

    outputs:
      page_url: ${{ steps.deploy-pages.outputs.page_url }}
      status: 'success'
      deployment_id: ${{ steps.create-deployment.outputs.deployment_id || steps.deploy-pages.outputs.deployment_id }}

    steps:
      - name: Load swiss-knife toolkit
        if: ${{ needs.build-and-upload.outputs.create_deployment == 'true' }}
        uses: Archetipo95/storybook-github-swiss-knife/actions/toolkit@c96f2b7bb57f43a2295bf794e4b1c9df8c0724c5

      - name: Create GitHub deployment (pending)
        id: create-deployment
        if: ${{ needs.build-and-upload.outputs.create_deployment == 'true' }}
        env:
          ACTION: create
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_REF: ${{ github.sha }}
          DEPLOYMENT_ENVIRONMENT: ${{ needs.build-and-upload.outputs.environment_name || needs.build-and-upload.outputs.environment || 'github-pages' }}
          ENVIRONMENT_URL: ${{ needs.build-and-upload.outputs.environment_url }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYMENT_DESCRIPTION: ${{ needs.build-and-upload.outputs.environment_name || needs.build-and-upload.outputs.environment || 'github-pages' }} deployment
        run: node "$SWISS_KNIFE_ROOT/src/github-deployments.js"

      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: ${{ needs.build-and-upload.outputs.artifact_name }}

      - name: Update GitHub deployment status (success)
        if: ${{ always() && steps.create-deployment.outputs.deployment_id != '' && steps.deploy-pages.outcome == 'success' }}
        env:
          ACTION: update
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ steps.create-deployment.outputs.deployment_id }}
          DEPLOYMENT_STATE: success
          ENVIRONMENT_URL: ${{ needs.build-and-upload.outputs.environment_url || steps.deploy-pages.outputs.page_url }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYMENT_DESCRIPTION: Deployment succeeded for ${{ needs.build-and-upload.outputs.environment_name || needs.build-and-upload.outputs.environment || 'github-pages' }}
        run: node "$SWISS_KNIFE_ROOT/src/github-deployments.js"

      - name: Update GitHub deployment status (failure)
        if: ${{ failure() && steps.create-deployment.outputs.deployment_id != '' }}
        env:
          ACTION: update
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_ID: ${{ steps.create-deployment.outputs.deployment_id }}
          DEPLOYMENT_STATE: failure
          ENVIRONMENT_URL: ${{ needs.build-and-upload.outputs.environment_url || steps.deploy-pages.outputs.page_url }}
          LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DEPLOYMENT_DESCRIPTION: Deployment failed for ${{ needs.build-and-upload.outputs.environment_name || needs.build-and-upload.outputs.environment || 'github-pages' }}
        run: node "$SWISS_KNIFE_ROOT/src/github-deployments.js"

  directory-publish:
    name: Publish Storybook directory
    needs: build-and-upload
    if: ${{ needs.build-and-upload.result == 'success' && needs.build-and-upload.outputs.mode == 'directory' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    outputs:
      page_url: ${{ steps.publish.outputs.page_url }}
      status: success
    steps:
      - name: Download trusted build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-and-upload.outputs.artifact_name }}
          path: storybook-static
      - name: Checkout Pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-and-upload.outputs.pages_branch }}
          path: pages-repo
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish directory atomically
        id: publish
        env:
          PAGES_REPO: ${{ github.workspace }}/pages-repo
          SOURCE_DIRECTORY: ${{ github.workspace }}/storybook-static
          PAGES_BRANCH: ${{ needs.build-and-upload.outputs.pages_branch }}
          TARGET_DIRECTORY: ${{ needs.build-and-upload.outputs.target_directory }}
          SITE_URL: ${{ needs.build-and-upload.outputs.site_url }}
          BASE_PATH: ${{ needs.build-and-upload.outputs.base_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        uses: Archetipo95/storybook-github-swiss-knife/actions/publisher@c96f2b7bb57f43a2295bf794e4b1c9df8c0724c5
        with:
          pages_repo: ${{ github.workspace }}/pages-repo
          source_directory: ${{ github.workspace }}/storybook-static
          pages_branch: ${{ needs.build-and-upload.outputs.pages_branch }}
          target_directory: ${{ needs.build-and-upload.outputs.target_directory }}
          managed_directories: ${{ needs.build-and-upload.outputs.managed_directories }}
          # An empty preview root keeps the pr-<N> directories at the root.
          preview_root: ${{ needs.build-and-upload.outputs.preview_root }}
          site_url: ${{ needs.build-and-upload.outputs.site_url }}
          base_path: ${{ needs.build-and-upload.outputs.base_path }}
          cname: ${{ needs.build-and-upload.outputs.cname }}
          preserve_cname: ${{ needs.build-and-upload.outputs.preserve_cname }}
          # The build job made the badges and the stats snapshot with the source; the publisher
          # keeps those badges and adds the snapshot to the Pages history.
          generate_badges: ${{ needs.build-and-upload.outputs.generate_badges }}
          badges_directory: ${{ needs.build-and-upload.outputs.badges_directory }}
          generate_stats_graph: ${{ needs.build-and-upload.outputs.generate_stats_graph }}
          stats_directory: ${{ needs.build-and-upload.outputs.stats_directory }}
