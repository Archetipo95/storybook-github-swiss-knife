name: Trusted Storybook preview cleanup
description: Remove preview directory for a closed pull request from a Pages branch
inputs:
  pages_repo:
    description: 'Path to checked-out Pages branch repository'
    required: false
    default: ''
  pages_branch:
    description: 'Pages branch name'
    required: false
    default: 'gh-pages'
  preview_root:
    description: 'Root directory for previews on the Pages branch'
    required: false
    default: 'pr-preview'
  pr_number:
    description: 'Pull request number to clean up'
    required: false
    default: ''
  trigger_pages_rebuild:
    description: 'Whether to request a Pages rebuild after the removal; set false when a push to the Pages branch already starts a build'
    required: false
    default: 'true'
  additional_paths:
    description: 'More directories to remove in the same commit, one per line, relative to the Pages branch root; {pr} is replaced by the pull request number'
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PAGES_REPO: ${{ inputs.pages_repo }}
        PAGES_BRANCH: ${{ inputs.pages_branch }}
        PREVIEW_ROOT: ${{ inputs.preview_root }}
        PR_NUMBER: ${{ inputs.pr_number }}
        TRIGGER_PAGES_REBUILD: ${{ inputs.trigger_pages_rebuild }}
        ADDITIONAL_PATHS: ${{ inputs.additional_paths }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: node "$GITHUB_ACTION_PATH/../../src/preview-cleanup.js"
